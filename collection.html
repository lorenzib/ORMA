<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Redirect stub only.

  Collections used to have their own detail page here, rendered by
  collection-detail.js. They are now shown inline on collections.html, so this
  file exists purely to keep old collection.html?id=... links working. The
  redirect below runs synchronously, before anything else on the page — which
  is why the whole shell (topnav, footer, twenty-odd deferred scripts and
  collection-detail.js itself) was dead weight that could never execute.
-->
<script>
  (function(){
    var id = new URLSearchParams(window.location.search).get('id');
    window.location.replace(id ? 'collections.html?collection=' + encodeURIComponent(id) : 'collections.html');
  })();
</script>
<title>Trail collection | ORMA</title>
<meta name="description" content="A curated ORMA trail collection.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.app-orma.com/collections.html">
<meta name="theme-color" content="#2E4034">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="styles.css?v=20260905-1">
</head>
<body>
<!-- Without JavaScript the redirect never fires, so give people a real link
     rather than a blank page. -->
<main class="content-canvas" style="padding:48px 20px;text-align:center;">
  <p>This collection now lives on the collections page.</p>
  <p><a href="collections.html">Continue to ORMA collections →</a></p>
</main>
</body>
</html>

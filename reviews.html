<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trail reviews | DoloPaws</title><link rel="stylesheet" href="styles.css?v=20260730-9">
<style>.review-summary[hidden]{display:none}.review-list[aria-busy="true"]{min-height:64px}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body class="flow-shell"><main class="flow-wrap" style="max-width:680px">
  <a id="reviewBack" class="flow-back" href="trail.html">← Alpe di Siusi Meadow Loop</a>
  <header class="flow-titlebar" style="margin-top:18px"><div><h1>Reviews</h1><div id="reviewSummary" class="review-summary" hidden><span class="review-stars">★★★★★</span><strong id="reviewAverage"></strong><span id="reviewCount"></span></div></div><button id="writeReview" class="flow-btn">Write a review</button></header>
  <section id="reviewComposer" class="flow-card review-compose" hidden>
    <div class="flow-context">Your rating</div><div id="starPicker" class="review-picker" aria-label="Your rating"><button aria-label="1 star">★</button><button aria-label="2 stars">★</button><button aria-label="3 stars">★</button><button aria-label="4 stars">★</button><button aria-label="5 stars">★</button></div>
    <label class="flow-field"><span>Your review</span><textarea id="reviewBody" rows="4" placeholder="How did the route feel for your dog?"></textarea></label>
    <div class="flow-actions"><button id="submitReview" class="flow-btn" disabled>Submit review</button><button id="cancelReview" class="flow-btn flow-btn--quiet">Cancel</button></div>
  </section>
  <p id="reviewStatus" class="flow-hint" role="status" aria-live="polite">Loading approved reviews…</p>
  <section id="reviewList" class="review-list" aria-busy="true"></section>
</main>
<script src="community-content-states.js?v=20260730-1"></script>
<script src="offline-contributions.js?v=20260811-1"></script>
<script type="module" src="firebase-init.js?v=20260811-2"></script>
<script src="auth-ui.js?v=20260812-1" defer></script>
<script src="reviews-page.js?v=20260811-1" defer></script>
</body></html>

name: Update POIs (food, drink, huts)

on:
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 5 2 * *'        # 2nd of each month, offset from the routes run

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch huts, bars, cafés and restaurants from OSM
        run: node scripts/fetch-huts-bars.js

      - name: Install dependencies
        run: npm ci

      # Each trail's own files list the huts and cafés near it, so new POIs
      # change about 35 trail files as well as the regional payloads. This job
      # used to rebuild only the payloads, and every refresh it opened failed
      # the quality gate on generated-artifact drift (#1220 needed two hand
      # rebuilds). Rebuild everything the gate rebuilds, offline as it does.
      - name: Rebuild everything generated from the POIs
        env:
          ORMA_PROMOTE_OFFLINE: 'true'
        run: npm run generate:artifacts

      - name: Confirm the rebuild matches what the quality gate expects
        run: npm run -s check:generated

      - name: Commit updated POIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dolopaws-bot"
          git config user.email "actions@github.com"
          git add huts-bars-all-regions.geojson data/regions/ data/regions-manifest.json regions-runtime-manifest.js \
            data/trail-details/ trails/ osm-trails-data.js osm-trails-savoy-data.js board-trails-data.js \
            browse-trails.html sitemap.xml data/generated/trail-validation-report.json trail-routing-coverage.js

          # Regeneration stamps a fresh generatedAt on every run, so a diff is
          # not by itself a change worth publishing. Committing those was how
          # this job produced a steady trickle of empty commits.
          substantive="$(git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -vE 'generatedAt' || true)"
          if [ -z "$substantive" ]; then
            echo "Only generation timestamps changed; nothing to publish."
            git reset
            exit 0
          fi

          # main is protected and requires a reviewed pull request, so this
          # opens one rather than pushing. It also means regenerated output
          # gets a quality-gate run before it lands, which a direct push
          # never had.
          branch="orma-bot/poi-refresh-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "Monthly POI refresh (food, drink, huts)"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Monthly POI refresh (food, drink, huts)" \
            --body "Monthly refresh of food, drink and hut points of interest. Opened automatically because main requires a reviewed pull request."

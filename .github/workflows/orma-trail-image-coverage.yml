name: ORMA trail photo coverage

on:
  workflow_dispatch:
    inputs:
      capacity:
        description: Maximum active trail-photo searches or reviews
        required: true
        default: '15'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
  schedule:
    - cron: '0 11 * * *'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: orma-trail-image-coverage
  cancel-in-progress: false

jobs:
  refresh-protected-trail-photo-queue:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_IMAGE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ORMA_IMAGE_SOURCING_CAPACITY: ${{ inputs.capacity || '15' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Refresh coverage and queue credited photo scouting
        run: npm run backoffice:image-coverage:live

name: Deploy private ORMA backoffice

on:
  pull_request:
    paths:
      - backoffice-*.html
      - backoffice-*.js
      - trail-verify-desk.html
      - trail-verify-desk.js
      - backoffice/dashboard-model.js
      - backoffice/product-funnel-model.js
      - backoffice/content-receipt-model.js
      - styles.css
      - favicon-32.png
      - logo.svg
      - backoffice-review.css
      - editorial-desk.html
      - editorial-desk.js
      - newsletter-hosted.html
      - newsletter-hosted.js
      - analyst-hosted.html
      - analyst-hosted.js
      - designer-desk.html
      - designer-desk.js
      - community-moderation-desk.html
      - moderation-page.js
      - moderation.css
      - community-content-states.js
      - product-prototype.js
      - backoffice/content-review-decisions.js
      - scripts/build-backoffice-hosting.js
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-backoffice-hosting.yml
  push:
    branches: [main]
    paths:
      - backoffice-*.html
      - backoffice-*.js
      - trail-verify-desk.html
      - trail-verify-desk.js
      - backoffice/dashboard-model.js
      - backoffice/product-funnel-model.js
      - backoffice/content-receipt-model.js
      - styles.css
      - favicon-32.png
      - logo.svg
      - backoffice-review.css
      - editorial-desk.html
      - editorial-desk.js
      - newsletter-hosted.html
      - newsletter-hosted.js
      - analyst-hosted.html
      - analyst-hosted.js
      - designer-desk.html
      - designer-desk.js
      - community-moderation-desk.html
      - moderation-page.js
      - moderation.css
      - community-content-states.js
      - product-prototype.js
      - backoffice/content-review-decisions.js
      - scripts/build-backoffice-hosting.js
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-backoffice-hosting.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-private-orma-backoffice
  cancel-in-progress: false

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/build-backoffice-hosting.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/build-backoffice-hosting.js
      - name: Deploy only the separate backoffice site
        run: npx --yes firebase-tools@15.26.0 deploy --only hosting:backoffice --project dolopaws --non-interactive

name: ORMA New Trail intake

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - backoffice-data/new-trail-scouting-review.json

concurrency:
  group: orma-new-trail-intake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-selected-candidates:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_NEW_TRAIL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
      - run: npm ci
      - name: Admit CEO-selected New Trails
        run: npm run backoffice:new-trail-intake
      - name: Start or continue verification agents
        run: npm run backoffice:worker:live

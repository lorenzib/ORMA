name: ORMA Dolomites-first trail scouting

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 10 * * 1-6'
      timezone: Europe/Rome

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scout-and-admit-selected-candidates:
    # Paused during the image and verification backfill: new trails add gaps to both
    # lanes faster than they close. Re-enable by setting ORMA_NEW_TRAIL_INTAKE_RESUMED.
    if: github.event_name == 'workflow_dispatch' || (vars.ORMA_NEW_TRAIL_AUTOMATION_ENABLED == 'true' && vars.ORMA_NEW_TRAIL_INTAKE_RESUMED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
      - run: npm ci
      - name: Refresh protected Dolomites-first trail candidates
        run: npm run backoffice:new-trail-scouting:live
      - name: Collect moderator selections and continue verification agents
        run: npm run backoffice:worker:new-trails

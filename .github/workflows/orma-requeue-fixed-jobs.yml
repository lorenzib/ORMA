name: ORMA requeue fixed jobs

# Running blocked jobs again once their cause has been fixed. A job blocked
# because the work was wrong stays blocked, which is right -- retrying a fault
# reproduces it. But when the fault was ours, those jobs are the only ones that
# can prove the fix, and nothing else releases them: the outage requeue takes
# only provider failures, and retiring marks a job completed rather than running
# it, and refuses the verification lanes anyway.
#
# Run by hand, and by hand on purpose: the tool refuses to decide which error
# has been fixed, so a person names it. There is deliberately no "release
# everything blocked" -- jobs whose cause is still live would spend the model
# budget to re-learn it.
#
# The state lives in Firestore, so this cannot run from a checkout: the
# credential stays in Actions instead of on anyone's machine.
on:
  workflow_dispatch:
    inputs:
      error_pattern:
        description: 'Error to release (blank lists every blocked error and changes nothing)'
        required: false
        default: ''
      reconsider_rejected:
        description: 'Instead of releasing jobs, look again at trails REJECTED for this reason (blank lists them)'
        required: false
        default: ''
      resurvey_trail_ids:
        description: 'Take the geometry survey again for these trails, comma separated. Free: the surveyor reads the map and measures.'
        required: false
        default: ''
      apply:
        description: 'Actually release them. Leave unchecked for a dry run.'
        type: boolean
        required: false
        default: false
      reason:
        description: 'Recorded on every job it releases'
        required: false
        default: 'the cause was fixed'
      limit:
        description: 'Most jobs to release in one pass'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: orma-requeue-fixed-jobs
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Requeue fixed jobs
        env:
          ERROR_PATTERN: ${{ inputs.error_pattern }}
          REASON: ${{ inputs.reason }}
          LIMIT: ${{ inputs.limit }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          # No error named: list what is blocked and stop. This is the first
          # thing to run, and it writes nothing.
          if [ -z "$ERROR_PATTERN" ]; then
            npm run backoffice:requeue-fixed
            exit 0
          fi
          args=(--error-pattern "$ERROR_PATTERN" --reason "$REASON" --limit "$LIMIT")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          else
            echo "[requeue] Dry run. Tick 'apply' to release them."
          fi
          npm run backoffice:requeue-fixed -- "${args[@]}"

      # A rejected trail is terminal and keeps the verdict that rejected it, so
      # a rule change reaches every trail still moving and none of the ones it
      # would have saved. Same discipline as the requeue above: the reason is
      # named, the pass is bounded, and nothing is written without 'apply'.
      # Always, because the CLI's blank mode is the listing: "what were trails
      # rejected for" is the question you ask before you can name a reason, and
      # gating the step on a reason made that answer unreachable from here. It
      # reads one artifact, calls no model and writes nothing without 'apply'.
      - name: Look again at rejected trails
        env:
          REASON: ${{ inputs.reconsider_rejected }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$REASON" ] && args+=(--reason "$REASON")
          # Only a named reason may change anything; a blank one lists.
          [ -n "$REASON" ] && [ "$APPLY" = "true" ] && args+=(--apply)
          npm run backoffice:reconsider -- "${args[@]}"

      # The geometry survey is deterministic and free, and it is where the map
      # reading lives -- so every improvement to it reaches only trails not yet
      # past it, and nothing in the pipeline goes backwards. Three improvements
      # landed on 15 October 2026 and five of the eight trails they were for had
      # already moved beyond the survey.
      #
      # It belongs here rather than in a workflow of its own: this is the place
      # for running something again once its cause has been fixed, and the
      # credential it needs is already in this job. Nothing is queued without
      # 'apply', and the trail does not move -- only its survey is retaken.
      - name: Survey named trails again
        if: inputs.resurvey_trail_ids != ''
        env:
          TRAIL_IDS: ${{ inputs.resurvey_trail_ids }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=(--trails "$TRAIL_IDS")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          else
            echo "[resurvey] Dry run. Tick 'apply' to queue the surveys."
          fi
          npm run backoffice:resurvey -- "${args[@]}"

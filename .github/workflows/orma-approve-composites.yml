name: ORMA rule on route composites

# Discovering the waymarked paths a walk follows, and ruling on the proposals.
# Both need Overpass, which is why they live here: the corridor query is large,
# the public mirrors throttle and time out, and the backoffice worker already
# reaches them reliably from Actions where a laptop on a shared address does not.
#
# Dispatched by hand because ruling is a human act. An approved composite is the
# moment a set of relations becomes a route source for a trail, so the person
# dispatching is recorded as the approver, and a proposal that could not be
# measured is held rather than approved -- "nothing was approved unmeasured".
#
# The result is a repository file, so it comes back as a pull request to read
# before it counts, never a commit straight to main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        options: [discover, approve]
        required: true
        default: discover
      candidate:
        description: 'Single trail id (blank does every eligible one)'
        required: false
        default: ''
      approved_by:
        description: 'Recorded as the approver on anything this approves'
        required: false
        default: 'Benedetta Lorenzi (ORMA owner)'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orma-route-composites
  cancel-in-progress: false

jobs:
  rule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rule on composites
        env:
          MODE: ${{ inputs.mode }}
          CANDIDATE: ${{ inputs.candidate }}
          APPROVED_BY: ${{ inputs.approved_by }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$CANDIDATE" ] && args+=(--candidate "$CANDIDATE")
          if [ "$MODE" = "approve" ]; then
            npm run backoffice:approve-composites -- "${args[@]}" --by "$APPROVED_BY"
          else
            npm run backoffice:discover-composites -- "${args[@]}"
          fi
      - name: Open a pull request for what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backoffice-data/route-composites.json; then
            echo "No composite changed. Nothing to open."
            exit 0
          fi
          branch="orma-bot/route-composites"
          git config user.name "ORMA Backoffice"
          git config user.email "orma-backoffice@users.noreply.github.com"
          git checkout -B "$branch"
          git add backoffice-data/route-composites.json
          # Anything else touched is a bug in the tool, not a result to merge.
          git diff --quiet || {
            echo "The composite run left other tracked files changed:"
            git diff --name-only
            exit 1
          }
          git commit -m "Rule on route composites ($MODE)"
          git push --force origin "$branch"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "Rule on route composites ($MODE)" \
              --body "Dispatched run of the composite $MODE. Read the diff before merging: an approved composite becomes a trail's route source."
          else
            echo "Updated existing pull request #$pr"
          fi

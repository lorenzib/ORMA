name: ORMA route gap report

# Read-only diagnostic, run by hand.
#
# Twenty-one catalogue trails are held back as drafts because the line drawn
# for a walker jumps 1-6 km somewhere along it. #773 showed the order of the
# relation's pieces is not the cause for these, so each is either a relation
# missing a way that is already mapped -- minutes of editing -- or a stretch
# nobody has mapped, which needs a survey or a rejection. Those need completely
# different work and the catalogue cannot tell them apart.
#
# This asks Overpass for the walkable ways around each gap and reports whether
# the two ends are joined. It fetches and prints; it writes no artifact,
# commits nothing and changes no trail.
#
# It runs here rather than on a laptop because Overpass answers 406 to requests
# it treats as anonymous bots, which is what a hand-rolled curl from a home
# connection gets. The repository's own client -- its mirror list, user agent
# and backoff -- is reused rather than copied.
on:
  workflow_dispatch:
    inputs:
      trail:
        description: 'Optional: one trail id to check (e.g. osm-6244965). Blank checks every draft.'
        required: false
        default: ''
      fresh:
        description: 'Ignore the last run and ask about every gap again.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # To find the last run of this workflow and download the checkpoint it left.
  actions: read

concurrency:
  group: orma-route-gap-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # The first full run was cancelled on a 45-minute limit with eight routes
    # unchecked. Overpass backs off across four mirrors and there are twenty-odd
    # gaps, so the budget has to cover a bad patch rather than a good one. The
    # script checkpoints after every gap, so even this limit loses nothing.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The checkpoint the script writes survives a cancellation within a run,
      # but a fresh run starts from a clean checkout -- so without this, asking
      # about four unanswered gaps costs twenty-one questions. Pull the last
      # run's answers in first and the script skips what it already knows.
      - name: Carry over what the last run answered
        if: ${{ !inputs.fresh }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No previous run, or no artifact on it, is an ordinary outcome and
          # must not fail the job -- it just means there is nothing to carry.
          previous=$(gh run list --workflow orma-route-gap-report.yml --status completed \
              --limit 20 --json databaseId --jq '.[].databaseId' || true)
          for id in $previous; do
            if gh run download "$id" --name route-gap-report --dir . 2>/dev/null; then
              echo "[gaps] resumed from run $id"
              break
            fi
          done
          if [ -f route-gap-report.json ]; then
            node -e "const g=require('./route-gap-report.json').gaps||{};const a=Object.values(g).filter(v=>!v.failed).length;console.log('[gaps] carried over '+a+' answered gap(s) of '+Object.keys(g).length);"
          else
            echo "[gaps] no previous checkpoint; starting fresh"
          fi
      - name: Ask OpenStreetMap what each gap needs
        env:
          TRAIL: ${{ inputs.trail }}
        run: |
          set -euo pipefail
          if [ -n "$TRAIL" ]; then
            node scripts/report-route-gaps.js --trail="$TRAIL"
          else
            node scripts/report-route-gaps.js
          fi
      # always(), so a run cut short still hands over the gaps it did answer.
      # Feed it back in as route-gap-report.json to carry on where it stopped.
      - name: Keep the answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-gap-report
          path: route-gap-report.json
          if-no-files-found: warn

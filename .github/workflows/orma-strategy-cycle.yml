name: ORMA parked strategy cycle

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

jobs:
  refresh-protected-desks:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_STRATEGY_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_MODEL: gpt-5.6-terra
      ORMA_NEWSLETTER_ENABLED: ${{ vars.ORMA_NEWSLETTER_ENABLED || 'false' }}
      ORMA_EDITORIAL_ENABLED: 'false'
      ORMA_ANALYST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secrets
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Preserve parked strategy desks
        run: npm run backoffice:strategy-cycle:live

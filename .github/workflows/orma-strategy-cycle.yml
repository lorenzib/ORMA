name: ORMA weekly strategy cycle

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * 3'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

jobs:
  refresh-protected-desks:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_STRATEGY_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
      - run: npm ci
      - name: Refresh protected Editorial, Newsletter and Analyst desks
        run: npm run backoffice:strategy-cycle:live

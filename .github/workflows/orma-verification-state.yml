name: ORMA verification state report

# Read-only diagnostic, run by hand. No trail is ORMA Verified, and that has two
# opposite explanations: either the human gates are the constraint, or few trails
# ever reach one. report-verification-state.js measures the gates and the
# decisions; report-verification-funnel.js measures where trails stop on the way,
# and whether anything is still owed to them.
#
# The state lives in Firestore, so it cannot be read from a checkout. Running it
# here keeps the credential in Actions instead of on anyone's machine, and the
# reporter never writes to Firestore or the website.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: orma-verification-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Report verification state
        run: npm run backoffice:verification-state
      - name: Report the verification funnel
        run: npm run backoffice:verification-funnel

name: ORMA verification state report

# Read-only diagnostic, run by hand. No trail is ORMA Verified, and that has two
# opposite explanations: either the human gates are the constraint, or few trails
# ever reach one. report-verification-state.js measures the gates and the
# decisions; report-verification-funnel.js measures where trails stop on the way,
# and whether anything is still owed to them.
#
# The state lives in Firestore, so it cannot be read from a checkout. Running it
# here keeps the credential in Actions instead of on anyone's machine, and the
# reporter never writes to Firestore or the website.
on:
  workflow_dispatch:
    inputs:
      trail:
        description: 'Optional: one candidateId to read in full (e.g. osm-16363583) -- dumps every blocker and claim verbatim instead of the summary'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: orma-verification-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Report verification state
        run: npm run backoffice:verification-state
      - name: Report the verification funnel
        run: npm run backoffice:verification-funnel
      - name: Check whether the waiting dossiers would approve
        run: npm run backoffice:check-approval

      # A long queue and an idle worker look identical in every other report.
      # Reads the orchestration artifact the step above already loaded, so this
      # costs no extra Firestore reads and calls no model. It answers whether
      # the research ladder's last attempts buy anything for the claims that
      # are allowed to stay unknown.
      - name: Report which attempt answered the claim
        run: npm run backoffice:resolution-yield

      - name: Read one trail's geometry audit
        if: ${{ inputs.trail != '' }}
        env:
          TRAIL: ${{ inputs.trail }}
        run: npm run backoffice:geometry-audit -- --trail="$TRAIL"

      # The question every other report in here answers sideways: which trail is
      # nearest the seal, and what stands between it and it. Same artifact the
      # steps above already loaded.
      - name: Report which trails are closest to verified
        run: npm run backoffice:closest

      # Why one named trail is not moving, which the stage reports cannot say:
      # a trail held at evidence-resolution by a base agent with no completed
      # job has no blocker and nothing queued, so it reads as ready.
      - name: Read why one trail is not moving
        if: ${{ inputs.trail != '' }}
        env:
          TRAIL: ${{ inputs.trail }}
        run: npm run backoffice:trail-progress -- --trail="$TRAIL"

      # The credentials come from the job, like every other step here. This
      # step named them again and got the secret's name wrong -- FIREBASE_
      # SERVICE_ACCOUNT_JSON rather than FIREBASE_SERVICE_ACCOUNT -- so a
      # step-level override replaced a working value with an empty one and the
      # dry run failed on "Could not load the default credentials". A step that
      # does not mention them cannot get them wrong.
      - name: What the dossier gate would say about this trail
        if: ${{ inputs.trail != '' }}
        env:
          TRAIL: ${{ inputs.trail }}
        run: npm run backoffice:gate-dryrun -- --trail="$TRAIL"

      # With no trail named, the same question asked of the shortlist: who is
      # close, and who is blocked by something no research will clear. Free,
      # and the answer decides where the model budget goes.
      - name: What the gate would say about the trails nearest the seal
        if: ${{ inputs.trail == '' }}
        run: npm run backoffice:gate-dryrun

      - name: Report why the job queue is not moving
        run: npm run backoffice:job-queue
      - name: Report what each waiting gate is asking
        env:
          TRAIL: ${{ inputs.trail }}
        run: |
          set -euo pipefail
          if [ -n "$TRAIL" ]; then
            npm run backoffice:gate-evidence -- --trail="$TRAIL" --full
          else
            npm run backoffice:gate-evidence
          fi
      - name: Dump one trail's claims verbatim
        if: inputs.trail != ''
        env:
          TRAIL: ${{ inputs.trail }}
        run: npm run backoffice:dump-dossier -- --trail="$TRAIL"

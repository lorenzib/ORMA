name: ORMA hazard watch

on:
  workflow_dispatch: {}
  schedule:
    # Every three hours. Hazard conditions change slowly, and this keeps the
    # backoffice within the Firestore daily quota (was hourly).
    - cron: '7 */3 * * *'
      timezone: Europe/Rome

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

jobs:
  check-warnings:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_HAZARD_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secret
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - run: npm ci
      - name: Check authoritative warning feeds into protected Firestore
        run: npm run backoffice:hazard-watch:live
      - name: Collect moderator removal decisions
        run: npm run backoffice:worker:hazards
      # Nothing this workflow does with the repository token starts another
      # workflow run: not the snapshot push, not the merge. So the website
      # deploy for a snapshot merged by an earlier run is dispatched here if it
      # never happened, before this run's own work.
      - name: Deploy the website if the last snapshot merge was never deployed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          head="$(git rev-parse HEAD)"
          if gh run list --workflow deploy-pages.yml --limit 30 --json headSha --jq '.[].headSha' | grep -qx "$head"; then
            echo "main ($head) already has a website deploy run."
          else
            echo "main ($head) has no website deploy run; dispatching one."
            gh workflow run deploy-pages.yml --ref main
          fi
      # main is protected (required quality gate, enforced for admins), so the
      # refreshed snapshot travels as a pull request. One fixed branch, force-
      # pushed, so a warning set that changes three times a day is one PR that
      # updates, not three. The PR's own quality-gate run parks at
      # action_required: the pusher is the Actions bot, and the first-time-
      # contributor approval policy never graduates a bot. A gate dispatched
      # onto the branch passes but never reaches the PR's required checks, so
      # the run approves the PR's own run instead, which is what a maintainer
      # would do by hand for one generated data file. It then waits for the
      # gate and merges the PR itself, updating the branch (and approving the
      # new run) if main moved meanwhile, and dispatches the website deploy,
      # which the merge alone would not start. Auto-merge stays armed as the
      # fallback if the gate outlasts the wait.
      - name: Publish the public warning snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          if git diff --quiet -- data/dynamic-hazards.json; then
            echo "The public warning snapshot is unchanged."
            exit 0
          fi
          branch="orma-bot/hazard-snapshot"
          git config user.name "ORMA Backoffice"
          git config user.email "orma-backoffice@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/dynamic-hazards.json
          git diff --quiet || {
            echo "Hazard watch left tracked files unstaged:"
            git diff --name-only
            exit 1
          }
          git commit -m "Refresh the public area-warning snapshot"
          git push --force origin "$branch"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head "$branch" \
              --title "Refresh the public area-warning snapshot" \
              --body "Generated by the ORMA hazard watch: the set of official area warnings changed. Merges itself once the quality gate passes." \
              | grep -oE '[0-9]+$')"
          fi
          approve_pending() {
            gh run list --workflow validate.yml --branch "$branch" --event pull_request --limit 5 \
              --json databaseId,conclusion,headSha \
              --jq ".[] | select(.headSha == \"$1\" and .conclusion == \"action_required\") | .databaseId" \
            | while read -r run; do
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/approve" >/dev/null; then
                  echo "Approved the pull request's quality-gate run ${run}."
                else
                  echo "Could not approve run ${run}; auto-merge stays armed for a maintainer to approve it."
                fi
              done
          }
          gh pr merge "$pr" --auto --squash
          sleep 20
          approve_pending "$(git rev-parse HEAD)"
          for attempt in $(seq 1 24); do
            sleep 15
            state="$(gh pr view "$pr" --json state,mergeStateStatus --jq '"\(.state) \(.mergeStateStatus)"')"
            echo "[$attempt] $state"
            case "$state" in
              MERGED*) break ;;
              "OPEN CLEAN") gh pr merge "$pr" --squash || true ;;
              "OPEN BLOCKED") approve_pending "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" ;;
              "OPEN BEHIND")
                gh pr update-branch "$pr" || true
                sleep 20
                approve_pending "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" ;;
            esac
          done
          if [ "$(gh pr view "$pr" --json state --jq .state)" = "MERGED" ]; then
            echo "Snapshot merged; dispatching the website deploy."
            gh workflow run deploy-pages.yml --ref main
          else
            echo "The quality gate outlasted the wait; auto-merge stays armed and the next run deploys."
          fi

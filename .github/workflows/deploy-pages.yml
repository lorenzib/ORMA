name: Deploy public site

# The repository has a .nojekyll file, so GitHub Pages' built-in build serves
# the repository root verbatim and never runs Jekyll. The `exclude:` list in
# _config.yml was therefore never applied, and operator data (backoffice-data/,
# the desk pages, the Node test suites, package.json) was published alongside
# the customer site.
#
# This workflow replaces that built-in build. scripts/build-pages-site.js
# assembles a _site/ directory from _config.yml's exclude list, and only that
# directory is deployed.
#
# Requires the repository's Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write      # say so when the hiking route tiles are missing or stale

# Never cancel a running deploy; let it finish and queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Assemble the public site
        run: node scripts/build-pages-site.js _site

      # The hiking network the maps draw (orma-hiking-route-tiles.yml). It is
      # built weekly into the Actions cache, never committed; the newest
      # saved set is published under data/hiking-routes/.
      - name: Restore the hiking route tiles
        id: hiking_tiles
        uses: actions/cache/restore@v6
        with:
          path: hiking-routes
          key: hiking-route-tiles-latest
          restore-keys: hiking-route-tiles-

      # Only when no set was ever saved, or the cache dropped it. If this
      # fails too, the site still deploys and the maps fall back to
      # Waymarked Trails' raster.
      - name: Build the hiking route tiles
        id: hiking_build
        if: steps.hiking_tiles.outputs.cache-matched-key == ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool tippecanoe
          bash scripts/build-hiking-route-tiles.sh hiking-work hiking-routes

      - name: Save the hiking route tiles
        if: steps.hiking_build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: hiking-routes
          key: hiking-route-tiles-${{ github.run_id }}

      - name: Publish the hiking route tiles
        run: |
          if [ -d hiking-routes ]; then
            # -p keeps the build's file dates, which the staleness check
            # below reads when a set has no built-at.txt.
            cp -Rp hiking-routes _site/data/hiking-routes
            echo "Published $(find _site/data/hiking-routes -name '*.pbf' | wc -l) hiking route tiles."
          else
            echo "::warning::No hiking route tiles; the maps will fall back to Waymarked Trails."
          fi

      # Catches what the weekly build's own alarm cannot: a timer that never
      # fired, or a cache that lost every set. Opens the issue only; the next
      # good weekly build closes it.
      - name: Say so when the hiking route tiles are missing or stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          health="$(node scripts/check-hiking-route-tiles.js _site/data/hiking-routes)"
          echo "Hiking route tiles: $health"
          state="$(node -p "JSON.parse(process.argv[1]).state" "$health")"
          age="$(node -p "JSON.parse(process.argv[1]).ageDays" "$health")"
          if [ "$state" = "missing" ]; then
            bash scripts/hiking-route-tiles-alert.sh raise-once "The site deployed with no hiking route tiles, so every map is drawing Waymarked Trails' raster instead of ORMA's routes."
          elif [ "$state" = "stale" ]; then
            bash scripts/hiking-route-tiles-alert.sh raise-once "The hiking route tiles on the site were built ${age} days ago. The weekly refresh has stopped."
          fi

      # Fails the deploy rather than publishing operator data, and fails it
      # again if the customer site came out incomplete.
      - name: Verify what is being published
        run: npx jest pages-site-build.test.js --runInBand

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

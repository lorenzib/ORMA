name: ORMA verification drain

# Run the worker's pass back to back until the verification queue is idle or a
# budget runs out. The scheduled worker does ten specialist jobs every three
# hours; the queue is created faster than that clears it, and no gate waits on
# a person any more, so the pipeline needs passes, not decisions.
#
# Passes are what the Firestore free tier rations. This shares the worker's
# lock so it never runs beside a scheduled pass, and it stops at the read and
# write budgets below so a drain cannot spend the quota the crons need. The
# ledger of what each pass cost is written as the `verification-drain`
# artifact and to the run summary.
#
# Publication (materialise, pull request, merge, deploy) is not run here; the
# scheduled worker that follows picks up whatever the drain made ready.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Stop starting new passes after this many minutes
        required: false
        default: '240'
      read_budget:
        description: Stop starting new passes once this many Firestore documents have been read
        required: false
        default: '20000'
      write_budget:
        description: Stop starting new passes once this many Firestore documents have been written
        required: false
        default: '8000'
      specialist_limit:
        description: Specialist jobs per pass
        required: false
        default: '10'

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain-verification-queue:
    runs-on: ubuntu-latest
    # A pass started inside the clock budget may still take ten minutes.
    timeout-minutes: 345
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      ORMA_SPECIALIST_LIMIT: ${{ github.event.inputs.specialist_limit || '10' }}
      ORMA_SPECIALIST_CONCURRENCY: ${{ vars.ORMA_SPECIALIST_CONCURRENCY || '4' }}
      ORMA_CAMPAIGN_AUTOMATION_ENABLED: 'true'
      ORMA_GATE_DISPATCH_ENABLED: ${{ vars.ORMA_GATE_DISPATCH_ENABLED || 'true' }}
      ORMA_GATE_DISPATCH_LIMIT: '3'
      ORMA_GATE_ADJUDICATION_ENABLED: ${{ vars.ORMA_GATE_ADJUDICATION_ENABLED || 'true' }}
      ORMA_GATE_ADJUDICATION_LIMIT: '2'
      ORMA_CAMPAIGN_LIMIT: '10'
      ORMA_CAMPAIGN_CAPACITY: '15'
      ORMA_DRAIN_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '240' }}
      ORMA_DRAIN_READ_BUDGET: ${{ github.event.inputs.read_budget || '20000' }}
      ORMA_DRAIN_WRITE_BUDGET: ${{ github.event.inputs.write_budget || '8000' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }

      - run: npm ci

      - name: Drain the verification queue
        id: drain
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:worker:drain 2>&1 | tee "$RUNNER_TEMP/orma-drain.log"

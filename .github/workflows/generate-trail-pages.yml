name: Generate static trail pages

on:
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 5 1 * *'        # monthly, 1 hour after the OSM route refresh
  push:
    branches: [main]
    paths:
      - 'trails-data.js'
      - 'osm-trails-data.js'
      - 'osm-trails-savoy-data.js'
      - 'scripts/generate-trail-pages.js'
      - 'scripts/load-production-trails.js'
      - 'scripts/trail-adapter.js'
      - 'scripts/trail-schema.js'
      - 'scripts/validate-production-trails.js'
      - 'schemas/trail.schema.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate all production trail sources
        run: node scripts/validate-production-trails.js

      - name: Generate trail pages and sitemap
        run: node scripts/generate-trail-pages.js

      - name: Build regional runtime payloads
        run: npm run build:regional-data

      - name: Commit generated pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dolopaws-bot"
          git config user.email "actions@github.com"
          git add trails/ sitemap.xml browse-trails.html data/regions/ data/regions-manifest.json regions-runtime-manifest.js

          # Regeneration stamps a fresh generatedAt on every run, so a diff is
          # not by itself a change worth publishing. Committing those was how
          # this job produced a steady trickle of empty commits.
          substantive="$(git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -vE 'generatedAt' || true)"
          if [ -z "$substantive" ]; then
            echo "Only generation timestamps changed; nothing to publish."
            git reset
            exit 0
          fi

          # main is protected and requires a reviewed pull request, so this
          # opens one rather than pushing. It also means regenerated output
          # gets a quality-gate run before it lands, which a direct push
          # never had.
          branch="orma-bot/trail-pages-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "Regenerate static trail pages and sitemap"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Regenerate static trail pages and sitemap" \
            --body "Static trail pages and the sitemap regenerated from current source data. Opened automatically because main requires a reviewed pull request."

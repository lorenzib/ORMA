name: Validate DoloPaws

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: .cache/firestore-emulator
          key: firestore-emulator-v1.21.0

      - name: Install test dependencies
        run: npm ci

      - name: Run the complete local-equivalent quality gate
        run: npm run quality:gate

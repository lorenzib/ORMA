name: Validate DoloPaws

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Validate production trail catalog
        run: node scripts/validate-production-trails.js

      - name: Validate canonical trail examples
        run: npm run validate:trail-schema

      - name: Run tests
        run: npm test -- --runInBand

      - name: Check static links
        run: npm run test:static

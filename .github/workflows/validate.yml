name: Validate ORMA

on:
  pull_request: {}
  push:
    branches: [main]
  # The hazard watch dispatches this onto its snapshot branch: a push made with
  # the workflow token starts no runs by itself, and main requires this gate.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: .cache/firestore-emulator
          key: firestore-emulator-v1.21.0

      - name: Install test dependencies
        run: npm ci

      - name: Run the complete local-equivalent quality gate
        run: npm run quality:gate

name: Validate DoloPaws

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: .cache/firestore-emulator
          key: firestore-emulator-v1.21.0

      - name: Install test dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Validate production trail catalog
        run: node scripts/validate-production-trails.js

      - name: Validate canonical trail examples
        run: npm run validate:trail-schema

      - name: Run tests
        run: npm test -- --runInBand

      - name: Test trusted contributor eligibility
        run: npm test --prefix functions

      - name: Audit function dependencies
        run: npm audit --audit-level=high --prefix functions

      - name: Test Firestore authorization rules
        run: npm run test:firestore-rules

      - name: Check static links
        run: npm run test:static

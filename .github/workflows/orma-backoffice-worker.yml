name: ORMA backoffice worker

on:
  workflow_dispatch:
    inputs:
      reverify_trail_ids:
        description: 'Trail ids to put through the pipeline even though they already carry a graduation, comma separated. One standard for every trail.'
        required: false
        default: ''
      candidate_id:
        description: Optional trail candidate ID for a controlled run
        required: false
        default: ''
      specialist_limit:
        description: Maximum specialist calls in this run
        required: false
        default: '10'
      force_publication_retry:
        description: Retry a publication before its cooldown expires after the external problem is corrected
        type: boolean
        required: false
        default: false
  schedule:
    # Every three hours (offset from the hazard watch). The verification
    # pipeline advances on its own on this cadence; a solo operator does not
    # need 30-minute batches, and this keeps Firestore within its daily quota.
    - cron: '20 */3 * * *'

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  # The worker says so when it has stopped, and an issue is the only channel
  # here that reaches somebody who is not already looking.
  issues: write

jobs:
  process-agent-queue:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_WORKER_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      ORMA_SPECIALIST_CANDIDATE_ID: ${{ github.event.inputs.candidate_id || '' }}
      ORMA_REVERIFY_TRAIL_IDS: ${{ github.event.inputs.reverify_trail_ids || '' }}
      ORMA_SPECIALIST_LIMIT: ${{ github.event.inputs.specialist_limit || '10' }}
      ORMA_SPECIALIST_CONCURRENCY: ${{ vars.ORMA_SPECIALIST_CONCURRENCY || '4' }}
      ORMA_PUBLICATION_FORCE_RETRY: ${{ github.event.inputs.force_publication_retry || 'false' }}
      ORMA_CAMPAIGN_AUTOMATION_ENABLED: 'true'
      # A gate standing only on findings an agent can supply is asked of that
      # agent. Set the repository variable to 'false' to stop it without a
      # code change; the limit is per pass.
      ORMA_GATE_DISPATCH_ENABLED: ${{ vars.ORMA_GATE_DISPATCH_ENABLED || 'true' }}
      ORMA_GATE_DISPATCH_LIMIT: '3'
      # The adjudicator that writes a cited recommendation onto a gate only she
      # can decide. Same kill switch shape as the dispatch above.
      ORMA_GATE_ADJUDICATION_ENABLED: ${{ vars.ORMA_GATE_ADJUDICATION_ENABLED || 'true' }}
      ORMA_GATE_ADJUDICATION_LIMIT: '2'
      # The Closure Scout searches one area's authorities for published
      # restrictions and files what it finds for vetting. Nobody publishes trail
      # closures as data for these regions, so this is how a closure is found
      # without waiting for a walker to report one. Off unless the repository
      # variable is 'true': it is an extra web-search call per area per run.
      ORMA_CLOSURE_SCOUT_ENABLED: ${{ vars.ORMA_CLOSURE_SCOUT_ENABLED || 'false' }}
      ORMA_CLOSURE_SCOUT_LIMIT: ${{ vars.ORMA_CLOSURE_SCOUT_LIMIT || '1' }}
      ORMA_CAMPAIGN_LIMIT: '10'
      # How many trails may be under research at once.
      #
      # Fifteen was sized when every trail cost about eight model calls to
      # verify, and it was protecting the credit budget from exactly that. Since
      # a geometry survey can settle all four unwaivable claims on its own, a
      # trail needs no model call at all to earn a seal, and 153 of the 163 in
      # the catalogue are in that position -- so the budget was throttling
      # against a cost that mostly no longer exists.
      #
      # It was also doing nothing but harm. `available` is
      # `min(capacity - active, queueCapacity - parked)`, and with 27 active
      # against 15 it was zero: **131 trails could not enter at all**, however
      # ready they were.
      #
      # Sixty rather than unlimited, so the first large batch is observable
      # before the whole catalogue is committed to it. Optional-detail research
      # still costs credits per trail, and the Firestore read budget is still
      # the ceiling on a pass.
      ORMA_CAMPAIGN_CAPACITY: ${{ vars.ORMA_CAMPAIGN_CAPACITY || '60' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }

      - run: npm ci

      - name: Check website publication gate
        id: website_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run backoffice:publication-gate

      - name: Record worker start
        id: worker_start
        shell: bash
        run: |
          set -o pipefail
          ORMA_WORKER_HEALTH_PHASE=start npm run backoffice:worker:health 2>&1 | tee "$RUNNER_TEMP/orma-worker-start.log"

      - name: Process review and agent queues
        id: process_queues
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:worker:live 2>&1 | tee "$RUNNER_TEMP/orma-worker-queues.log"

      - name: Materialize approved trail publications
        id: materialize
        if: steps.website_gate.outputs.publication_allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:materialize-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-materialize.log"

      - name: Detect a new publication
        id: publication
        shell: bash
        run: |
          set -o pipefail
          {
            if git diff --quiet -- data/verified-trail-overrides.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-detection.log"

      - name: Validate and generate website artifacts
        id: validate_publication
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            npm run generate:artifacts
            npm test -- --runInBand
            npm run test:static
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-validation.log"

      - name: Open publication pull request
        id: open_publication_pr
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          {
            branch="orma-bot/trail-publication-${GITHUB_RUN_ID}"
            git config user.name "ORMA Backoffice"
            git config user.email "orma-backoffice@users.noreply.github.com"
            git checkout -b "$branch"
            git add data/verified-trail-overrides.json data/route-operational-facts.json data/generated/trail-validation-report.json data/trail-details data/regions data/regions-manifest.json regions-runtime-manifest.js trails sitemap.xml browse-trails.html
            git diff --quiet || {
              echo "Publication generation left tracked files unstaged:"
              git diff --name-only
              exit 1
            }
            git commit -m "Publish evidence-policy-approved trail updates"
            git push origin "$branch"
            pr_url="$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Publish evidence-policy-approved trail updates" \
              --body "Generated by the ORMA Backoffice after route, evidence and locked-copy validation. The workflow merges this PR only after Validate ORMA passes.")"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-pr.log"

      - name: Record publication pull request receipt
        id: acknowledge_publication
        if: steps.publication.outputs.changed == 'true'
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:acknowledge-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-acknowledgement.log"

      - name: Merge validated trail publication and deploy it
        id: publish_validated_trails
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -o pipefail
          {
            pr="${ORMA_PUBLICATION_PR_URL##*/}"
            branch="$(gh pr view "$pr" --json headRefName --jq .headRefName)"
            approve_pending() {
              gh run list --workflow validate.yml --branch "$branch" --event pull_request --limit 5 \
                --json databaseId,conclusion,headSha \
                --jq ".[] | select(.headSha == \"$1\" and .conclusion == \"action_required\") | .databaseId" \
              | while read -r run; do
                  gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/approve" >/dev/null \
                    && echo "Approved quality-gate run ${run}." \
                    || echo "Quality-gate run ${run} is not awaiting approval."
                done
            }
            gh pr merge "$pr" --auto --squash
            sleep 20
            approve_pending "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
            for attempt in $(seq 1 24); do
              sleep 15
              state="$(gh pr view "$pr" --json state,mergeStateStatus --jq '"\(.state) \(.mergeStateStatus)"')"
              echo "[$attempt] $state"
              case "$state" in
                MERGED*) break ;;
                "OPEN CLEAN") gh pr merge "$pr" --squash || true ;;
                "OPEN BLOCKED") approve_pending "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" ;;
                "OPEN BEHIND")
                  gh pr update-branch "$pr" || true
                  sleep 20
                  approve_pending "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" ;;
              esac
            done
            test "$(gh pr view "$pr" --json state --jq .state)" = "MERGED" \
              || { echo "The publication PR did not merge before the bounded wait ended."; exit 1; }
            gh workflow run validate.yml --ref main
            gh workflow run deploy-pages.yml --ref main
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-merge.log"

      - name: Record publication automation failure
        id: publication_failure_receipt
        if: ${{ always() && (steps.materialize.outcome == 'failure' || steps.publication.outcome == 'failure' || steps.validate_publication.outcome == 'failure' || steps.open_publication_pr.outcome == 'failure' || steps.acknowledge_publication.outcome == 'failure' || steps.publish_validated_trails.outcome == 'failure') }}
        shell: bash
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        run: |
          set -o pipefail
          stage="publication-automation"
          log="$RUNNER_TEMP/orma-publication-materialize.log"
          retryable="true"
          if [ "${{ steps.publication.outcome }}" = "failure" ]; then
            stage="publication-change-detection"
            log="$RUNNER_TEMP/orma-publication-detection.log"
          elif [ "${{ steps.validate_publication.outcome }}" = "failure" ]; then
            stage="website-validation"
            log="$RUNNER_TEMP/orma-publication-validation.log"
          elif [ "${{ steps.open_publication_pr.outcome }}" = "failure" ]; then
            stage="pull-request-creation"
            log="$RUNNER_TEMP/orma-publication-pr.log"
          elif [ "${{ steps.acknowledge_publication.outcome }}" = "failure" ]; then
            stage="pull-request-receipt"
            log="$RUNNER_TEMP/orma-publication-acknowledgement.log"
            retryable="false"
          elif [ "${{ steps.publish_validated_trails.outcome }}" = "failure" ]; then
            stage="pull-request-merge-and-deploy"
            log="$RUNNER_TEMP/orma-publication-merge.log"
          fi
          ORMA_AUTOMATION_FAILURE_STAGE="$stage" \
          ORMA_AUTOMATION_FAILURE_LOG="$log" \
          ORMA_AUTOMATION_FAILURE_RETRYABLE="$retryable" \
          npm run backoffice:record-publication-failure 2>&1 | tee "$RUNNER_TEMP/orma-publication-failure-receipt.log"

      - name: Verify the latest successful Pages deployment
        id: deployed_publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run backoffice:find-pages-deployment

      - name: Check out the exact deployed website commit
        id: checkout_deployed_publication
        if: steps.deployed_publication.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.deployed_publication.outputs.commit_sha }}
          path: deployed-site

      - name: Record protected publication deployment receipts
        id: confirm_deployed_publication
        if: steps.deployed_publication.outputs.found == 'true'
        env:
          ORMA_PUBLICATION_COMMIT_SHA: ${{ steps.deployed_publication.outputs.commit_sha }}
          ORMA_PUBLICATION_DEPLOYMENT_URL: ${{ steps.deployed_publication.outputs.run_url }}
          ORMA_PUBLICATION_PUBLIC_BASE_URL: https://www.app-orma.com
          ORMA_PUBLICATION_OVERRIDES_PATH: deployed-site/data/verified-trail-overrides.json
        run: |
          npm run backoffice:confirm-publications

      - name: Record worker completion
        id: worker_health
        if: ${{ always() }}
        shell: bash
        env:
          ORMA_GATE_ALLOWED: ${{ steps.website_gate.outputs.publication_allowed }}
          ORMA_GATE_PENDING: ${{ steps.website_gate.outputs.publication_pending }}
          ORMA_GATE_MESSAGE: ${{ steps.website_gate.outputs.message }}
          ORMA_GATE_RUN_URL: ${{ steps.website_gate.outputs.validation_run_url }}
          ORMA_WORKER_WORK_OUTCOME: ${{ steps.process_queues.outputs.work_outcome }}
          ORMA_WORKER_WORK_ATTEMPTED: ${{ steps.process_queues.outputs.work_attempted }}
          ORMA_WORKER_WORK_SUCCEEDED: ${{ steps.process_queues.outputs.work_succeeded }}
          ORMA_WORKER_WORK_FAILED: ${{ steps.process_queues.outputs.work_failed }}
          ORMA_WORKER_WORK_PROVIDER_PARKED: ${{ steps.process_queues.outputs.work_provider_parked }}
          ORMA_WORKER_WORK_MESSAGE: ${{ steps.process_queues.outputs.work_message }}
          ORMA_WORKER_WORK_READS: ${{ steps.process_queues.outputs.work_reads }}
          ORMA_WORKER_WORK_WRITES: ${{ steps.process_queues.outputs.work_writes }}
        run: |
          outcome="success"
          stage=""
          log=""
          message=""
          validation_url=""
          if [ "${{ steps.website_gate.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="website-publication-gate-check"
          elif [ "${{ steps.worker_start.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="worker-health-start"
            log="$RUNNER_TEMP/orma-worker-start.log"
          elif [ "${{ steps.process_queues.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="review-and-agent-queues"
            log="$RUNNER_TEMP/orma-worker-queues.log"
          elif [ "${{ steps.materialize.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-materialization"
            log="$RUNNER_TEMP/orma-publication-materialize.log"
          elif [ "${{ steps.publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-change-detection"
            log="$RUNNER_TEMP/orma-publication-detection.log"
          elif [ "${{ steps.validate_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="website-validation"
            log="$RUNNER_TEMP/orma-publication-validation.log"
          elif [ "${{ steps.open_publication_pr.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="pull-request-creation"
            log="$RUNNER_TEMP/orma-publication-pr.log"
          elif [ "${{ steps.acknowledge_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="pull-request-receipt"
            log="$RUNNER_TEMP/orma-publication-acknowledgement.log"
          elif [ "${{ steps.publish_validated_trails.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="pull-request-merge-and-deploy"
            log="$RUNNER_TEMP/orma-publication-merge.log"
          elif [ "${{ steps.publication_failure_receipt.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-failure-receipt"
            log="$RUNNER_TEMP/orma-publication-failure-receipt.log"
          elif [ "${{ steps.deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployment-verification"
          elif [ "${{ steps.checkout_deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployed-commit-checkout"
          elif [ "${{ steps.confirm_deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployment-receipt"
          elif [ "$ORMA_GATE_ALLOWED" != "true" ] && [ "$ORMA_GATE_PENDING" != "true" ]; then
            # A gate still waiting on a validation run is not a blocked one.
            # Publication is withheld either way, but only this branch means
            # something needs a person.
            outcome="blocked"
            stage="website-publication-gate"
            message="$ORMA_GATE_MESSAGE"
            validation_url="$ORMA_GATE_RUN_URL"
          elif [ "$ORMA_WORKER_WORK_OUTCOME" = "unproductive" ]; then
            # Every step passed and no job got done. Ranked below a real failure
            # and below the publication gate, because those name a cause that
            # this one cannot see.
            outcome="degraded"
            stage="agent-work"
            message="$ORMA_WORKER_WORK_MESSAGE"
          fi
          ORMA_WORKER_HEALTH_PHASE=finish \
          ORMA_WORKER_HEALTH_OUTCOME="$outcome" \
          ORMA_WORKER_FAILURE_STAGE="$stage" \
          ORMA_WORKER_FAILURE_LOG="$log" \
          ORMA_WORKER_FAILURE_MESSAGE="$message" \
          ORMA_WORKER_VALIDATION_RUN_URL="$validation_url" \
          npm run backoffice:worker:health

      # A worker that dies quietly is worse than one that never starts. The
      # consecutive-failure count was recorded from the very first run and read
      # only by the dashboard, which nobody opens while they believe the
      # pipeline is running: it stopped at 16:00 on 13 October, on a Firestore
      # document that had outgrown its limit, and was found hours later by
      # being asked about rather than by saying so.
      #
      # One issue, opened on the second consecutive failure so a single blip
      # stays quiet, commented on while it persists, and closed by the run that
      # recovers. The issue is the notification; nothing here needs watching.
      - name: Say so when the worker has stopped
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.worker_health.outputs.health_status }}
          FAILURES: ${{ steps.worker_health.outputs.consecutive_failures }}
          LAST_OK: ${{ steps.worker_health.outputs.last_successful_at }}
          STAGE: ${{ steps.worker_health.outputs.failure_stage }}
          # A worker that could not even write its own health receipt has no
          # counter to debounce against, and is the one case where silence is
          # guaranteed. Raised on the first occurrence for that reason.
          HEALTH_STEP: ${{ steps.worker_health.outcome }}
          LABEL: orma-worker-stopped
        shell: bash
        run: |
          set -o pipefail
          title="ORMA worker has stopped"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Found by label, not by title search: issue search is indexed
          # asynchronously, and an index that has not caught up would open a
          # second issue every three hours. A label lookup is exact and
          # immediate. Creating it is idempotent.
          gh label create "$LABEL" --description "The scheduled backoffice worker is not completing" --color B60205 >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"

          # Recovered, or nothing standing: close whatever is open and say so.
          if [ "${HEALTH_STEP:-success}" != "failure" ] && { [ "${STATUS:-}" = "healthy" ] || [ "${FAILURES:-0}" = "0" ]; }; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Recovered: the worker completed at $(date -u +%FT%TZ). ${run_url}" || true
              gh issue close "$existing" --reason completed || true
            fi
            exit 0
          fi

          if [ "${HEALTH_STEP:-success}" = "failure" ]; then
            headline="The ORMA backoffice worker could not even record its own health, so the failure count below may be behind."
          else
            # One failure is a blip; two in a row is the pipeline being down.
            if [ "${FAILURES:-0}" -lt 2 ]; then
              echo "One failure so far. Not raising an alarm until the next run also fails."
              exit 0
            fi
            headline="The ORMA backoffice worker has failed ${FAILURES} runs in a row and is not advancing any trail."
          fi

          body="${headline}

          Last successful run: ${LAST_OK:-unknown}
          Failed at stage: ${STAGE:-unknown}
          This run: ${run_url}

          Nothing is being verified while this is open. The run log above carries the error; \`npm run backoffice:artifact-sizes\` and \`npm run backoffice:closest\` are the two quickest reads. This issue closes itself when a run succeeds."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing. ${headline} ${run_url}" || true
          else
            gh issue create --title "$title" --body "$body" --label "$LABEL" || true
          fi

      # The other way the pipeline stops, and the quieter one.
      #
      # A run can complete every step, go green, and achieve nothing: the jobs
      # are claimed, the model provider refuses them all, and the worker
      # reports success because nothing about the run went wrong. The failure
      # alarm above never fires, because there is no failure. The pipeline sat
      # dead from 11 October this way, and stopped again on 14 October when the
      # OpenAI credits ran out — found both times by somebody asking.
      #
      # Its own issue rather than the one above, because what to go and do is
      # different: that one is a bug to read a log for, this one is usually a
      # bill to pay.
      - name: Say so when the worker is getting nothing done
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          UNPRODUCTIVE: ${{ steps.worker_health.outputs.consecutive_unproductive }}
          LAST_PRODUCTIVE: ${{ steps.worker_health.outputs.last_productive_at }}
          SINCE: ${{ steps.worker_health.outputs.unproductive_since }}
          PARKED: ${{ steps.worker_health.outputs.provider_parked }}
          MESSAGE: ${{ steps.worker_health.outputs.unproductive_message }}
          LABEL: orma-worker-idle
        shell: bash
        run: |
          set -o pipefail
          title="ORMA worker is running but getting nothing done"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "$LABEL" --description "The worker completes but no job succeeds" --color D93F0B >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"

          # A run that got something done, or had nothing to do, closes it. An
          # idle run leaves the counter alone, so it never reads as recovery
          # on its own.
          if [ "${UNPRODUCTIVE:-0}" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Working again: a run got jobs through at $(date -u +%FT%TZ). ${run_url}" || true
              gh issue close "$existing" --reason completed || true
            fi
            exit 0
          fi

          # One pass where nothing landed can be a rate limit or a bad minute.
          if [ "${UNPRODUCTIVE:-0}" -lt 2 ]; then
            echo "One unproductive run so far. Not raising an alarm until the next one is also empty."
            exit 0
          fi

          if [ "${PARKED:-false}" = "true" ]; then
            cause="The model provider refused every request, so this is billing or an outage rather than anything in the code. Credits: https://platform.openai.com/settings/organization/billing"
          else
            cause="Jobs are being claimed and none are completing. The run log carries the error from the agents."
          fi

          body="The ORMA backoffice worker has completed ${UNPRODUCTIVE} runs in a row without a single job getting through. The runs are green: nothing is failing, and nothing is being verified either.

          Nothing has been got done since: ${LAST_PRODUCTIVE:-unknown}
          Empty since: ${SINCE:-unknown}
          This run: ${run_url}

          ${cause}

          What the worker said:
          ${MESSAGE:-(no message recorded)}

          This issue closes itself when a run gets jobs through."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still empty: ${UNPRODUCTIVE} runs in a row with nothing completed. ${run_url}" || true
          else
            gh issue create --title "$title" --body "$body" --label "$LABEL" || true
          fi

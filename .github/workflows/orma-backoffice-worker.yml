name: ORMA backoffice worker

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Optional trail candidate ID for a controlled run
        required: false
        default: ''
      specialist_limit:
        description: Maximum specialist calls in this run
        required: false
        default: '5'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  process-agent-queue:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_WORKER_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      ORMA_SPECIALIST_CANDIDATE_ID: ${{ github.event.inputs.candidate_id || '' }}
      ORMA_SPECIALIST_LIMIT: ${{ github.event.inputs.specialist_limit || '5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }

      - run: npm ci

      - name: Process review and agent queues
        run: npm run backoffice:worker:live

      - name: Materialize approved trail publications
        id: materialize
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:materialize-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-materialize.log"

      - name: Detect a new publication
        id: publication
        shell: bash
        run: |
          if git diff --quiet -- data/verified-trail-overrides.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and generate website artifacts
        id: validate_publication
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            npm run generate:artifacts
            npm test -- --runInBand
            npm run test:static
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-validation.log"

      - name: Open publication pull request
        id: open_publication_pr
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          {
            branch="orma-bot/verified-trails-${GITHUB_RUN_ID}"
            git config user.name "ORMA Backoffice"
            git config user.email "orma-backoffice@users.noreply.github.com"
            git checkout -b "$branch"
            git add data/verified-trail-overrides.json data/regions data/regions-manifest.json regions-runtime-manifest.js trails sitemap.xml browse-trails.html
            git commit -m "Publish human-approved ORMA Verified trails"
            git push origin "$branch"
            pr_url="$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Publish human-approved ORMA Verified trails" \
              --body "Generated by the ORMA Backoffice after an explicit publication approval. Review the trail override and generated website artifacts before merging.")"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-pr.log"

      - name: Record publication pull request receipt
        id: acknowledge_publication
        if: steps.publication.outputs.changed == 'true'
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:acknowledge-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-acknowledgement.log"

      - name: Record publication automation failure
        if: ${{ always() && (steps.materialize.outcome == 'failure' || steps.validate_publication.outcome == 'failure' || steps.open_publication_pr.outcome == 'failure' || steps.acknowledge_publication.outcome == 'failure') }}
        shell: bash
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        run: |
          stage="publication-automation"
          log="$RUNNER_TEMP/orma-publication-materialize.log"
          retryable="true"
          if [ "${{ steps.validate_publication.outcome }}" = "failure" ]; then
            stage="website-validation"
            log="$RUNNER_TEMP/orma-publication-validation.log"
          elif [ "${{ steps.open_publication_pr.outcome }}" = "failure" ]; then
            stage="pull-request-creation"
            log="$RUNNER_TEMP/orma-publication-pr.log"
          elif [ "${{ steps.acknowledge_publication.outcome }}" = "failure" ]; then
            stage="pull-request-receipt"
            log="$RUNNER_TEMP/orma-publication-acknowledgement.log"
            retryable="false"
          fi
          ORMA_AUTOMATION_FAILURE_STAGE="$stage" \
          ORMA_AUTOMATION_FAILURE_LOG="$log" \
          ORMA_AUTOMATION_FAILURE_RETRYABLE="$retryable" \
          npm run backoffice:record-publication-failure

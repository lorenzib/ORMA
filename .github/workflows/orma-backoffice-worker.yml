name: ORMA backoffice worker

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Optional trail candidate ID for a controlled run
        required: false
        default: ''
      specialist_limit:
        description: Maximum specialist calls in this run
        required: false
        default: '10'
      force_publication_retry:
        description: Retry a publication before its cooldown expires after the external problem is corrected
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  process-agent-queue:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_WORKER_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      ORMA_SPECIALIST_CANDIDATE_ID: ${{ github.event.inputs.candidate_id || '' }}
      ORMA_SPECIALIST_LIMIT: ${{ github.event.inputs.specialist_limit || '10' }}
      ORMA_PUBLICATION_FORCE_RETRY: ${{ github.event.inputs.force_publication_retry || 'false' }}
      ORMA_CAMPAIGN_AUTOMATION_ENABLED: ${{ vars.ORMA_CAMPAIGN_AUTOMATION_ENABLED || 'false' }}
      ORMA_CAMPAIGN_LIMIT: '10'
      ORMA_CAMPAIGN_CAPACITY: '15'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }

      - run: npm ci

      - name: Check website publication gate
        id: website_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run backoffice:publication-gate

      - name: Record worker start
        id: worker_start
        shell: bash
        run: |
          set -o pipefail
          ORMA_WORKER_HEALTH_PHASE=start npm run backoffice:worker:health 2>&1 | tee "$RUNNER_TEMP/orma-worker-start.log"

      - name: Process review and agent queues
        id: process_queues
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:worker:live 2>&1 | tee "$RUNNER_TEMP/orma-worker-queues.log"

      - name: Materialize approved trail publications
        id: materialize
        if: steps.website_gate.outputs.publication_allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:materialize-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-materialize.log"

      - name: Materialize approved trail photos
        id: materialize_images
        if: steps.website_gate.outputs.publication_allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:materialize-trail-images 2>&1 | tee "$RUNNER_TEMP/orma-image-materialize.log"

      - name: Detect a new publication
        id: publication
        shell: bash
        run: |
          set -o pipefail
          {
            if git diff --quiet -- data/verified-trail-overrides.json data/trail-image-overrides.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-detection.log"

      - name: Validate and generate website artifacts
        id: validate_publication
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            npm run generate:artifacts
            npm test -- --runInBand
            npm run test:static
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-validation.log"

      - name: Open publication pull request
        id: open_publication_pr
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          {
            branch="orma-bot/trail-publication-${GITHUB_RUN_ID}"
            git config user.name "ORMA Backoffice"
            git config user.email "orma-backoffice@users.noreply.github.com"
            git checkout -b "$branch"
            git add data/verified-trail-overrides.json data/route-operational-facts.json data/trail-image-overrides.json data/generated/trail-validation-report.json data/trail-details data/regions data/regions-manifest.json regions-runtime-manifest.js trails sitemap.xml browse-trails.html
            if [ -d images/trails ]; then git add images/trails; fi
            git diff --quiet || {
              echo "Publication generation left tracked files unstaged:"
              git diff --name-only
              exit 1
            }
            git commit -m "Publish human-approved trail updates"
            git push origin "$branch"
            pr_url="$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Publish human-approved trail updates" \
              --body "Generated by the ORMA Backoffice after explicit publication approval. This may contain verified trail records, approved trail photos, or both. Review the overrides, image rights metadata and generated website artifacts before merging.")"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RUNNER_TEMP/orma-publication-pr.log"

      - name: Record publication pull request receipt
        id: acknowledge_publication
        if: steps.publication.outputs.changed == 'true'
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:acknowledge-publications 2>&1 | tee "$RUNNER_TEMP/orma-publication-acknowledgement.log"

      - name: Record trail-photo pull request receipt
        id: acknowledge_images
        if: steps.publication.outputs.changed == 'true'
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -o pipefail
          npm run backoffice:acknowledge-trail-images 2>&1 | tee "$RUNNER_TEMP/orma-image-acknowledgement.log"

      - name: Record publication automation failure
        id: publication_failure_receipt
        if: ${{ always() && (steps.materialize.outcome == 'failure' || steps.materialize_images.outcome == 'failure' || steps.publication.outcome == 'failure' || steps.validate_publication.outcome == 'failure' || steps.open_publication_pr.outcome == 'failure' || steps.acknowledge_publication.outcome == 'failure' || steps.acknowledge_images.outcome == 'failure') }}
        shell: bash
        env:
          ORMA_PUBLICATION_PR_URL: ${{ steps.open_publication_pr.outputs.pr_url }}
        run: |
          set -o pipefail
          stage="publication-automation"
          log="$RUNNER_TEMP/orma-publication-materialize.log"
          retryable="true"
          if [ "${{ steps.publication.outcome }}" = "failure" ]; then
            stage="publication-change-detection"
            log="$RUNNER_TEMP/orma-publication-detection.log"
          elif [ "${{ steps.materialize_images.outcome }}" = "failure" ]; then
            stage="trail-image-materialization"
            log="$RUNNER_TEMP/orma-image-materialize.log"
          elif [ "${{ steps.validate_publication.outcome }}" = "failure" ]; then
            stage="website-validation"
            log="$RUNNER_TEMP/orma-publication-validation.log"
          elif [ "${{ steps.open_publication_pr.outcome }}" = "failure" ]; then
            stage="pull-request-creation"
            log="$RUNNER_TEMP/orma-publication-pr.log"
          elif [ "${{ steps.acknowledge_publication.outcome }}" = "failure" ]; then
            stage="pull-request-receipt"
            log="$RUNNER_TEMP/orma-publication-acknowledgement.log"
            retryable="false"
          elif [ "${{ steps.acknowledge_images.outcome }}" = "failure" ]; then
            stage="trail-image-pull-request-receipt"
            log="$RUNNER_TEMP/orma-image-acknowledgement.log"
            retryable="false"
          fi
          ORMA_AUTOMATION_FAILURE_STAGE="$stage" \
          ORMA_AUTOMATION_FAILURE_LOG="$log" \
          ORMA_AUTOMATION_FAILURE_RETRYABLE="$retryable" \
          npm run backoffice:record-publication-failure 2>&1 | tee "$RUNNER_TEMP/orma-publication-failure-receipt.log"

      - name: Verify the latest successful Pages deployment
        id: deployed_publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run backoffice:find-pages-deployment

      - name: Check out the exact deployed website commit
        id: checkout_deployed_publication
        if: steps.deployed_publication.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.deployed_publication.outputs.commit_sha }}
          path: deployed-site

      - name: Record protected publication deployment receipts
        id: confirm_deployed_publication
        if: steps.deployed_publication.outputs.found == 'true'
        env:
          ORMA_PUBLICATION_COMMIT_SHA: ${{ steps.deployed_publication.outputs.commit_sha }}
          ORMA_PUBLICATION_DEPLOYMENT_URL: ${{ steps.deployed_publication.outputs.run_url }}
          ORMA_PUBLICATION_PUBLIC_BASE_URL: https://www.app-orma.com
          ORMA_PUBLICATION_OVERRIDES_PATH: deployed-site/data/verified-trail-overrides.json
          ORMA_TRAIL_IMAGE_OVERRIDES_PATH: deployed-site/data/trail-image-overrides.json
        run: |
          npm run backoffice:confirm-publications
          npm run backoffice:confirm-trail-images

      - name: Record worker completion
        if: ${{ always() }}
        shell: bash
        env:
          ORMA_GATE_ALLOWED: ${{ steps.website_gate.outputs.publication_allowed }}
          ORMA_GATE_MESSAGE: ${{ steps.website_gate.outputs.message }}
          ORMA_GATE_RUN_URL: ${{ steps.website_gate.outputs.validation_run_url }}
        run: |
          outcome="success"
          stage=""
          log=""
          message=""
          validation_url=""
          if [ "${{ steps.website_gate.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="website-publication-gate-check"
          elif [ "${{ steps.worker_start.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="worker-health-start"
            log="$RUNNER_TEMP/orma-worker-start.log"
          elif [ "${{ steps.process_queues.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="review-and-agent-queues"
            log="$RUNNER_TEMP/orma-worker-queues.log"
          elif [ "${{ steps.materialize.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-materialization"
            log="$RUNNER_TEMP/orma-publication-materialize.log"
          elif [ "${{ steps.materialize_images.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="trail-image-materialization"
            log="$RUNNER_TEMP/orma-image-materialize.log"
          elif [ "${{ steps.publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-change-detection"
            log="$RUNNER_TEMP/orma-publication-detection.log"
          elif [ "${{ steps.validate_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="website-validation"
            log="$RUNNER_TEMP/orma-publication-validation.log"
          elif [ "${{ steps.open_publication_pr.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="pull-request-creation"
            log="$RUNNER_TEMP/orma-publication-pr.log"
          elif [ "${{ steps.acknowledge_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="pull-request-receipt"
            log="$RUNNER_TEMP/orma-publication-acknowledgement.log"
          elif [ "${{ steps.acknowledge_images.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="trail-image-pull-request-receipt"
            log="$RUNNER_TEMP/orma-image-acknowledgement.log"
          elif [ "${{ steps.publication_failure_receipt.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-failure-receipt"
            log="$RUNNER_TEMP/orma-publication-failure-receipt.log"
          elif [ "${{ steps.deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployment-verification"
          elif [ "${{ steps.checkout_deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployed-commit-checkout"
          elif [ "${{ steps.confirm_deployed_publication.outcome }}" = "failure" ]; then
            outcome="failure"
            stage="publication-deployment-receipt"
          elif [ "$ORMA_GATE_ALLOWED" != "true" ]; then
            outcome="blocked"
            stage="website-publication-gate"
            message="$ORMA_GATE_MESSAGE"
            validation_url="$ORMA_GATE_RUN_URL"
          fi
          ORMA_WORKER_HEALTH_PHASE=finish \
          ORMA_WORKER_HEALTH_OUTCOME="$outcome" \
          ORMA_WORKER_FAILURE_STAGE="$stage" \
          ORMA_WORKER_FAILURE_LOG="$log" \
          ORMA_WORKER_FAILURE_MESSAGE="$message" \
          ORMA_WORKER_VALIDATION_RUN_URL="$validation_url" \
          npm run backoffice:worker:health

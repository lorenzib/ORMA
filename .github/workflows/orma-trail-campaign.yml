name: ORMA trail verification campaign

on:
  workflow_dispatch:
    inputs:
      limit:
        description: New trails to admit into verification
        required: false
        default: '10'
  schedule:
    - cron: '30 9 * * *'
      timezone: Europe/Rome

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-next-trails:
    if: github.event_name == 'workflow_dispatch' || vars.ORMA_CAMPAIGN_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      CAMPAIGN_LIMIT: ${{ github.event.inputs.limit || '10' }}
      CAMPAIGN_CAPACITY: '15'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
      - run: npm ci
      - name: Admit the post-reset daily ORMA Verified candidate batch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run backoffice:campaign:live -- --limit "$CAMPAIGN_LIMIT" --capacity "$CAMPAIGN_CAPACITY" --scheduled
          else
            npm run backoffice:campaign:live -- --limit "$CAMPAIGN_LIMIT" --capacity "$CAMPAIGN_CAPACITY" --force
          fi
      - name: Start the first agent pass
        run: npm run backoffice:worker:live

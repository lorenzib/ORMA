name: ORMA trail verification campaign

on:
  workflow_dispatch:
    inputs:
      limit:
        description: New trails to admit into verification
        required: false
        default: '10'
  schedule:
    - cron: '30 9 * * *'
      timezone: Europe/Rome

concurrency:
  group: orma-backoffice-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-next-trails:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: dolopaws
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      ORMA_CONTENT_ROUTINE_MODEL: gpt-5.6-luna
      ORMA_CONTENT_AUDIT_MODEL: gpt-5.6-terra
      ORMA_CAMPAIGN_AUTOMATION_ENABLED: 'true'
      # The job that actually admits trails runs here, not in the worker, so the
      # capacity has to be set here too. #847 raised it to 60 in
      # orma-backoffice-worker.yml and nothing changed: this workflow fell back
      # to the built-in 15, `available` stayed at zero, and the campaign ran
      # successfully at 07:40 on 17 October admitting nobody.
      #
      # Read from the same repository variable as the worker, so the number
      # cannot be raised in one place and left behind in the other.
      # Passed on the command line below. There were two more variables here,
      # CAMPAIGN_CAPACITY: '15' and a CAMPAIGN_LIMIT, and those were the ones
      # the command actually used -- so the capacity this file had already been
      # corrected twice to read from the repository variable was set, logged,
      # and ignored. The run on 19 October printed `ORMA_CAMPAIGN_CAPACITY: 60`
      # and `CAMPAIGN_CAPACITY: 15` one line apart and admitted nobody, for the
      # third morning running. One name, used where it is read.
      ORMA_CAMPAIGN_CAPACITY: ${{ vars.ORMA_CAMPAIGN_CAPACITY || '60' }}
      ORMA_CAMPAIGN_LIMIT: ${{ vars.ORMA_CAMPAIGN_LIMIT || github.event.inputs.limit || '10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check worker secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
      - run: npm ci
      - name: Admit the post-reset daily ORMA Verified candidate batch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run backoffice:campaign:live -- --limit "$ORMA_CAMPAIGN_LIMIT" --capacity "$ORMA_CAMPAIGN_CAPACITY" --scheduled
          else
            npm run backoffice:campaign:live -- --limit "$ORMA_CAMPAIGN_LIMIT" --capacity "$ORMA_CAMPAIGN_CAPACITY" --force
          fi
      - name: Start the first agent pass
        run: npm run backoffice:worker:live

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Trail production review | ORMA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260817-3">
  <link rel="stylesheet" href="backoffice-review.css?v=20260817-1">
</head>
<body class="bo-shell">
  <header class="bo-header">
    <a href="index.html" class="bo-brand">🐾 ORMA</a>
    <span>Trail production</span>
  </header>
  <main class="bo-main">
    <div class="bo-title-row">
      <div>
        <p class="eyebrow">Private local prototype</p>
        <h1>Trail review queue</h1>
        <p class="bo-intro">Review mapped route geometry and parking suggestions. Nothing here publishes to ORMA.</p>
      </div>
      <button id="exportDecisions" type="button" disabled>Export decisions</button>
    </div>
    <div id="backofficeState" class="bo-state" role="status" aria-live="polite">Checking operator access…</div>
    <section id="backofficeSummary" class="bo-summary" hidden></section>
    <section id="backofficeQueue" class="bo-queue" aria-label="Trail candidates"></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="firebase-init.js"></script>
  <script src="backoffice/review-decisions.js"></script>
  <script src="backoffice-review.js?v=20260817-1"></script>
</body>
</html>

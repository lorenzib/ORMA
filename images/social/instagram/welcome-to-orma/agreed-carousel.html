<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>ORMA Welcome Carousel Export</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
#orma-carousel-preview{font-family:Inter,Arial,sans-serif;color:light-dark(#203128,#f4efe4);display:grid;gap:16px;max-width:760px;margin:auto}
#orma-carousel-preview h2,#orma-carousel-preview .principle{font-family:'Bricolage Grotesque',sans-serif!important;font-optical-sizing:auto}
#orma-carousel-preview .stage{display:grid;grid-template-columns:42px minmax(0,430px) 42px;align-items:center;justify-content:center;gap:12px}
#orma-carousel-preview .nav{width:42px;height:42px;border:1px solid light-dark(#ccd6cf,#56655c);border-radius:50%;background:light-dark(#fff,#26372e);color:inherit;font-size:22px;cursor:pointer}
#orma-carousel-preview .slide{position:relative;aspect-ratio:4/5;overflow:hidden;background:#23332a url('orma-bg.png') center/cover no-repeat;color:#f4efe4;padding:48px 42px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 42px rgba(20,39,29,.22)}
#orma-carousel-preview .slide::before{content:attr(data-number);position:absolute;top:24px;right:26px;color:#b9c8bd;font-size:13px;font-weight:700;letter-spacing:.12em}
#orma-carousel-preview .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#a8c5b0;margin-bottom:16px}
#orma-carousel-preview h2{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:36px;line-height:1.03;margin:0 0 20px;max-width:9em}
#orma-carousel-preview p{font-size:18px;line-height:1.48;margin:0 0 14px;max-width:19em}
#orma-carousel-preview .principle{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:32px;line-height:1.12;max-width:10em}
#orma-carousel-preview .photo{height:43%;margin:-8px -4px 24px;border:2px solid rgba(168,197,176,.8);overflow:hidden;background:#16251d}
#orma-carousel-preview .photo img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.88) contrast(.96) brightness(1.015) sepia(.035)}
#orma-carousel-preview .has-image{justify-content:flex-start}
#orma-carousel-preview .has-image p{font-size:15px;line-height:1.42}
#orma-carousel-preview .has-image h2{font-size:31px;margin-bottom:14px}
#orma-carousel-preview .quote-card{text-align:left}
#orma-carousel-preview .quote-card .photo{height:24%;margin-bottom:17px}
#orma-carousel-preview .quote-card .eyebrow,#orma-carousel-preview .quote-card .intro,#orma-carousel-preview .quote-card p,#orma-carousel-preview .quote-card .signature{font-size:14px;line-height:1.4;max-width:24em;margin-left:0;margin-right:0}
#orma-carousel-preview .quote-card .intro{color:#d9e2db;margin-bottom:11px}
#orma-carousel-preview .quote-card h2{font-size:27px;line-height:1.07;max-width:11.2em;margin:0 0 12px}
#orma-carousel-preview .signature{font-weight:700;color:#d9e2db;margin-top:12px}
#orma-carousel-preview .slide[data-number="2 / 7"] .photo{width:320px;height:240px;margin:-8px auto 14px}
#orma-carousel-preview .slide[data-number="2 / 7"] .photo img{object-fit:contain;background:#16251d}
#orma-carousel-preview .slide[data-number="3 / 7"] .photo img{filter:none}
#orma-carousel-preview .slide[data-number="7 / 7"]{display:grid;grid-template-columns:195px 145px;grid-template-rows:auto 193px auto auto;column-gap:18px;row-gap:12px;align-content:start;justify-content:start}
#orma-carousel-preview .slide[data-number="7 / 7"] .eyebrow{grid-column:1 / -1;grid-row:1;margin:0}
#orma-carousel-preview .slide[data-number="7 / 7"] .photo{grid-column:2;grid-row:2;width:145px;height:193px;margin:0}
#orma-carousel-preview .slide[data-number="7 / 7"] .photo img{object-fit:contain;object-position:center!important;background:#16251d}
#orma-carousel-preview .slide[data-number="7 / 7"] .intro{grid-column:1;grid-row:2;align-self:end;margin:0}
#orma-carousel-preview .slide[data-number="7 / 7"] h2{grid-column:1 / -1;grid-row:3;max-width:none;margin:0}
#orma-carousel-preview .slide[data-number="7 / 7"] .signature{grid-column:1 / -1;grid-row:4;margin-top:0}
#orma-carousel-preview .dots{display:flex;justify-content:center;gap:8px}
#orma-carousel-preview .dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#aeb9b2;cursor:pointer}.dot[aria-pressed="true"]{background:#4f8060;transform:scale(1.25)}
#orma-carousel-preview .note{text-align:center;font-size:13px;color:light-dark(#617168,#bdc8c1)}
@media(max-width:540px){#orma-carousel-preview .stage{grid-template-columns:30px minmax(0,1fr) 30px;gap:6px}#orma-carousel-preview .nav{width:30px;height:30px;font-size:17px}#orma-carousel-preview .slide{padding:36px 28px}#orma-carousel-preview h2{font-size:29px}#orma-carousel-preview p{font-size:15px}#orma-carousel-preview .principle{font-size:26px}}
html,body{width:1080px;height:1350px;margin:0!important;padding:0!important;overflow:hidden;background:#23332a}
#orma-carousel-preview{display:block;width:1080px;height:1350px;max-width:none;margin:0;overflow:hidden}
#orma-carousel-preview .stage{display:block;width:1080px;height:1350px}
#orma-carousel-preview .slide{width:430px;height:537.5px;aspect-ratio:auto;transform:scale(2.51162790698);transform-origin:top left;box-shadow:none}
#orma-carousel-preview .nav{display:block!important;position:fixed!important;right:10px!important;bottom:10px!important;width:20px!important;height:20px!important;opacity:.001!important;z-index:20!important}
#orma-carousel-preview .dots,#orma-carousel-preview .note{display:none!important}
</style>
</head>

  function draw(){const c=cards[active];slide.dataset.number=`${active+1} / ${cards.length}`;slide.classList.toggle('has-image',Boolean(c.image));slide.classList.toggle('quote-card',Boolean(c.quote));slide.innerHTML=`<div class="eyebrow">${esc(c.e)}</div>${c.image?`<div class="photo"><img src="${esc(c.image)}" alt="${esc(c.alt)}" style="object-position:${esc(c.position||'center')}"></div>`:''}${c.intro?c.intro.map(x=>`<p class="intro">${esc(x)}</p>`).join(''):''}${c.h?`<h2>${esc(c.h)}</h2>`:''}${c.principle?`<div class="principle">${esc(c.principle)}</div>`:''}${c.p.map(x=>`<p>${esc(x)}</p>`).join('')}${c.sig?`<div class="signature">${esc(c.sig)}</div>`:''}`;root.querySelectorAll('.dot').forEach((d,i)=>d.setAttribute('aria-pressed',String(i===active)));}
  const dots=root.querySelector('.dots');cards.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`Show card ${i+1}`);b.addEventListener('click',()=>{active=i;draw()});dots.appendChild(b)});
